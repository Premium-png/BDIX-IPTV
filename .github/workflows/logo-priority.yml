name: Repository-first IPTV logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'logos/**'
      - 'scripts/sync_logos.py'
      - '.github/workflows/logo-priority.yml'

permissions:
  contents: write

concurrency:
  group: iptv-playlist-and-epg
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Apply repository-first logos without changing streams or groups
        run: python scripts/sync_logos.py
      - name: Commit logo URLs if changed
        run: |
          git config user.name 'IPTV Update Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'IPTV Playlist.m3u'
          git diff --cached --quiet || (git commit -m 'bot: prefer repository logos with external fallback' && git push)

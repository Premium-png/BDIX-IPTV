name: Sync Fork

on:
  schedule:
    - cron: '*/5 * * * *' # हर 5 मिनट में सिंक करेगा
  workflow_dispatch: # मैनुअली रन करने का विकल्प

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master to main
        uses: tgymrich/fork-sync-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: sajidujon-rahman             # ओरिजिनल ओनर का नाम
          head: master                        # ओरिजिनल ओनर की सोर्स ब्रांच
          base: main                          # आपके अकाउंट की टारगेट ब्रांच
